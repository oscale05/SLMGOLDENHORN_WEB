server {
    listen 443 ssl http2;
    server_name slmgoldenhorn.com slmgoldenhorn.com.ar;

    ssl_certificate /etc/letsencrypt/live/slm.goldenhorn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slm.goldenhorn/privkey.pem;

    # Redirect .com.ar to .com
    if ($host = slmgoldenhorn.com.ar) {
        return 301 https://slmgoldenhorn.com$request_uri;
    }

    location /api/ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
